services:
  # --- INFRAESTRUTURA ---
  postgres:
    image: postgres:16-alpine
    container_name: ledger_postgres
    environment:
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: ledger_password
      POSTGRES_DB: ledger_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - gateway_network

  redis:
    image: redis:7-alpine
    container_name: ledger_redis
    ports:
      - "6379:6379"
    networks:
      - gateway_network

  # CORREÇÃO DEFINITIVA: Adicionado Zookeeper estável para gerenciar o Cluster DNS do Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ledger_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - gateway_network

  # CORREÇÃO DEFINITIVA: Mudança para a imagem do Confluent Kafka (Imune a travamentos no Windows)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ledger_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - gateway_network

  # --- MICROSSERVIÇOS TYPESCRIPT ---
  api-ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway_api_ingestion
    ports:
      - "3000:3000"
    environment:
      - KAFKA_BROKERS=kafka:29092
      - REDIS_URL=redis://ledger_redis:6379
    depends_on:
      - kafka
      - redis
    networks:
      - gateway_network

  worker-ledger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway_worker_ledger
    command: ["node", "dist/worker/consumer.js"]
    environment:
      - KAFKA_BROKERS=kafka:29092
      - REDIS_URL=redis://ledger_redis:6379
      - DATABASE_URL=postgresql://ledger_user:ledger_password@ledger_postgres:5432/ledger_db
    depends_on:
      - kafka
      - redis
      - postgres
    networks:
      - gateway_network

volumes:
  pgdata:

networks:
  gateway_network:
    driver: bridge
